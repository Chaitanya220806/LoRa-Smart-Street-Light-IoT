services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: smart-streetlight-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  influxdb:
    image: influxdb:2
    container_name: smart-streetlight-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: smartstreetlight123
      DOCKER_INFLUXDB_INIT_ORG: smartstreetlight
      DOCKER_INFLUXDB_INIT_BUCKET: streetlight
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: smartstreetlight-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  influxdb_data:
